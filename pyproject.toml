[project]
name = "unflatten"
version = "0.1.0"
description = "Unflatten 1.0 MoE — Canonical Document AST contract package (RFC001)"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.21",
    "lxml>=5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
]
ml = [
    "torch>=2.13.0",
    # page images are PNG in the object store; decoding them is the
    # only image dependency the training path needs
    "pillow>=13.0.0",
    # Do not trust the compromised emSign intermediate chain during HF TLS.
    "certifi>=2026.10.19",
    # Stage-0 backbone probe: frozen VLM feature extraction. Qwen3-VL
    # support landed in transformers 4.57.
    "transformers>=4.57",
    # transformers 5.x routes every image processor through torchvision
    "torchvision>=0.24",
    # Runtime uses native CUDA loading; Accelerate dispatch is not required.
    # Keep safe floors for Hugging Face cache locks and wheel installation.
    "filelock>=4.2.10",
    "setuptools>=84.2.1",
    # required by PaddleOCR-VL custom modeling code
    "einops>=0.8",
]
server = [
    "fastapi>=0.116",
    "uvicorn>=0.35",
    # DEC-044 Dodatok D §2 (B2): required for FastAPI/Starlette's
    # multipart/form-data parsing (Request.form()).
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unflatten"]

[tool.pytest.ini_options]
# This standalone application distribution exercises its service and document
# contracts by default; training/agent-tooling tests belong to the source project.
testpaths = ["tests/service", "tests/renderer", "tests/ast"]
addopts = "-m 'not slow'"
markers = [
    "slow: long-running smoke tests (deselected by default; run with -m slow)",
    "integration: requires an external runtime or service",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".claude", ".opencode"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Notebooks are cells, not modules. E402 ("import not at top") is inherent --
# a notebook imports where the narrative reaches that step -- and I001 sorts
# across comment blocks that carry the cell's reasoning. E, F and UP still
# apply, so the checks that catch real defects stay on.
"notebooks/*.ipynb" = ["E402", "I001"]

[tool.coverage.run]
source = ["src/unflatten"]

[tool.coverage.report]
fail_under = 80
